    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {

                        theme: {
                            bg: '#F5F2E9',        // Beige claro principal
                            beige: '#EAE5D9',     // Beige para bordes/fondos secundarios

                            greenDark: '#4A8BCC', // Tono azul ligeramente más oscuro para contrastes

                            textMuted: '#849085'  // Gris claro apagado

    <style>

        /* ==================== MODO OSCURO ==================== */
        body.dark {
            background-color: #121826 !important; /* Fondo noche profundo */
            color: #e2e8f0 !important;
        }
        body.dark .glass, body.dark .bg-white, body.dark .bg-white\/80, body.dark .bg-white\/90 {
            background-color: rgba(30, 41, 59, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }
        body.dark .text-theme-text, body.dark .text-theme-greenDark {
            color: #6ee7b7 !important; /* Verde menta para resaltar en oscuro */
        }
        body.dark .text-theme-textMuted {
            color: #94a3b8 !important;
        }
        body.dark .bg-theme-bg, body.dark .bg-theme-beige {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark input, body.dark select {
            background-color: #334155 !important;
            color: white !important;
            border-color: #475569 !important;
        }

        /* ==================== ANIMACIONES MICRO-INTERACTIVAS ==================== */
        /* Efecto de rebote para el carrito */
        @keyframes cartBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.15) translateY(-2px); color: #10b981; }
            100% { transform: scale(1); }
        }
        .animate-cart-bump {
            animation: cartBump 0.3s ease-out;
        }

        /* Efecto de explosión de éxito al cobrar */
        @keyframes successPop {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-success-pop {
            animation: successPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        * {
            font-family: 'Poppins', sans-serif;
        }

        /* Ajuste de scrollbar para tema claro */
        .scrollbar-thin::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            border: 2px solid #F5F2E9;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .animate-slideIn {
            animation: slideIn 0.3s ease-out;
        }

        .animate-pulse-custom {
            animation: pulse 2s infinite;
        }

        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Efecto Glassmorphism ajustado para tema claro */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

       /* Botón primario en azul Vaninas */
       .btn-primary {
            background: linear-gradient(135deg, #5DA1E8 0%, #4A8BCC 100%);
            color: white;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(93, 161, 232, 0.4); /* Sombra azulada */
        }

        .card-hover {
            transition: all 0.3s;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.06);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
        }

        /* 📱 ESTILOS CRÍTICOS PARA EL EDITOR MÓVIL */
        
        /* 1. Evita que la pantalla rebote o haga scroll en móvil al arrastrar */
        .stop-scrolling {
            height: 100%;
            overflow: hidden !important;
            position: fixed;
            width: 100%;
        }

        /* 2. Área de dibujo optimizada para gestos */
        #floorPlanCanvas {
            touch-action: none; /* Desactiva zoom y scroll nativo del navegador en esta área */
            -webkit-user-select: none; /* Evita seleccionar texto al mantener presionado */
            user-select: none;
        }

       /* 3. Ajuste de tamaño de mesas para dedos (un poco más grandes en móvil si es necesario) */
       @media (max-width: 640px) {
            .edit-table-item {
                width: 15vw !important;
                height: 15vw !important;
                min-width: 55px !important;
                min-height: 55px !important;
                max-width: 80px !important;
                max-height: 80px !important;
            }
            .edit-table-item .table-name {
                font-size: 11px !important;
                line-height: 1.1 !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 90%;
            }
            .edit-table-item .delete-btn {
                width: 24px !important;
                height: 24px !important;
                font-size: 10px !important;
                top: -4px !important;
                right: -4px !important;
            }
        }

        /* 📱 ESTILOS CRÍTICOS PARA EL EDITOR MÓVIL */
        .touch-none-area {
            touch-action: none !important; /* Desactiva el scroll y zoom del celular */
            -webkit-user-select: none; /* Evita que el celular intente seleccionar texto */
            user-select: none;
        }

       /* 🖨️ ESTILOS UNIVERSALES PARA IMPRESORAS TÉRMICAS (80mm y 58mm) */
      /* 🖨️ ESTILOS UNIVERSALES PARA IMPRESORAS TÉRMICAS (80mm y 58mm) */
@media print {
    @page {
        margin: 0 !important;
        size: auto; /* Permite que el navegador detecte el ancho del papel */
    }
    
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        width: 100% !important;
        height: 100% !important;
    }

    /* Ocultar elementos que no deben imprimirse */
    #app > :not(#modalContainer) {
        display: none !important;
    }

    /* Contenedor del Ticket */
    #modalContainer {
        position: static !important;
        display: block !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Ajuste para que el área de impresión sea flexible */
    #printArea {
        position: static !important;
        width: 100% !important; 
        max-width: 100% !important; /* Adaptable a 58mm o 80mm */
        margin: 0 auto !important;
        padding: 0 2mm !important; /* Un margen mínimo para que no pegue el texto al borde */
        box-shadow: none !important;
        border: none !important;
        box-sizing: border-box !important;
    }

    /* Asegurar que las imágenes y tablas no se desborden */
    img {
        max-width: 100% !important;
        height: auto !important;
    }

    /* Asegurar que los botones estén ocultos */
    .print\:hidden {
        display: none !important;
    }
}

<body class="h-full bg-theme-bg text-theme-text overflow-auto">
    <div id="app" class="h-full flex flex-col">

        <div id="loadingScreen"
            class="h-full flex flex-col items-center justify-center p-4 bg-theme-bg z-50 absolute inset-0">
            <div class="text-6xl mb-4 animate-pulse-custom">🍺</div>
            <h2 class="text-xl font-bold text-theme-greenDark">Conectando con a la nube...</h2>
        </div>

        <div id="loginScreen" class="hidden h-full flex items-center justify-center p-4">
            <div class="glass rounded-3xl p-8 w-full max-w-md animate-slideIn border border-white shadow-2xl">
                <div class="text-center mb-8">
                    <img src="van.png" alt="Logo Rufaza" class="w-32 h-32 mx-auto mb-4 object-contain drop-shadow-md rounded-2xl">
                    
                    <h1 class="text-3xl font-bold text-theme-greenDark">VANINAS</h1>
                    <p class="text-theme-textMuted mt-2 leading-tight">
                        Sistema de Gestión Integral <br> 
                        <span class="text-sm">punto de venta, comandas y control de inventarios</span>
                    </p>
                </div>
                <div class="space-y-4">

                    <div>
                        <label class="block text-sm font-bold mb-2 text-theme-text">Usuario</label>
                        <input type="text" id="loginUser"
                            class="w-full px-4 py-3 bg-white/80 border border-theme-beige rounded-xl focus:outline-none focus:border-theme-green transition text-theme-text font-medium"
                            placeholder="Ingrese su usuario">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-theme-text">Contraseña</label>
                        <div class="relative">
                            <input type="password" id="loginPass"
                                class="w-full px-4 py-3 bg-white/80 border border-theme-beige rounded-xl focus:outline-none focus:border-theme-green transition text-theme-text font-medium pr-12"
                                placeholder="Ingrese su contraseña">
                            <button type="button" onclick="togglePasswordVisibility('loginPass', 'loginPassIcon')" class="absolute inset-y-0 right-0 px-4 flex items-center text-xl text-theme-textMuted hover:text-theme-greenDark transition focus:outline-none">
                                <span id="loginPassIcon">👁️</span>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-theme-text">Sucursal</label>
                        <select id="loginBranch" class="w-full px-4 py-3 bg-white/80 border border-theme-beige rounded-xl focus:outline-none focus:border-theme-green transition text-theme-text font-bold">
                            <option value="sucursal_principal">📍 Sucursal Principal</option>
                            <option value="sucursal_centro">🏪 Sucursal Centro</option>
                        </select>
                    </div>
                    
                    <div id="loginError" class="hidden text-red-600 text-sm font-bold text-center p-3 bg-red-50 border border-red-200 rounded-xl">
                    </div>
                    <button onclick="handleLogin()" class="w-full btn-primary font-bold py-3.5 rounded-xl mt-4 shadow-md text-lg">
                        Iniciar Sesión 
                    </button>
                </div>
                <div class="mt-8 text-center text-xs font-medium text-theme-textMuted bg-theme-bg p-3 rounded-xl border border-theme-beige">
                    <p> Sistema desarrollado por la empresa DY CodeStudio</p>
                </div>
            </div>
        </div>

        <div id="mainApp" class="hidden h-full flex flex-col">
            <header class="glass border-b border-white px-3 md:px-4 py-3 flex items-center justify-between shrink-0 gap-2">
                <div class="flex items-center gap-2 md:gap-3">
                    <img src="van.png" alt="Logo Rufaza" class="w-10 h-10 md:w-12 md:h-12 object-contain rounded-lg drop-shadow-sm">
                    <div>
                        <h1 class="text-lg md:text-xl font-bold text-theme-greenDark leading-tight flex items-center gap-2">
                            SISTEMA POS 
                            <span id="headerBranchName" class="text-[10px] md:text-xs bg-theme-green text-white px-2 py-1 rounded-lg shadow-sm">Principal</span>
                        </h1>
                    </div>
                </div>

                <div class="hidden lg:flex flex-1 justify-center">
                    <div class="glass px-6 py-1.5 rounded-2xl border border-white shadow-sm flex flex-col items-center justify-center bg-white/40">
                        <span id="currentDateDisplay" class="text-[10px] font-bold text-theme-textMuted uppercase tracking-widest leading-none mb-1">Cargando fecha...</span>
                        <span id="currentTimeDisplay" class="text-2xl font-black text-theme-greenDark tracking-wider leading-none drop-shadow-sm">--:--:--</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 md:gap-4">
                    <button onclick="toggleDarkMode()" id="darkModeBtn" class="p-1.5 md:p-2 hover:bg-white/60 rounded-lg transition text-xl md:text-2xl" title="Cambiar Tema">
                        🌙
                    </button>
                    
                    <div id="notificationBell" class="relative cursor-pointer p-1" onclick="toggleNotifications()">
                        <span class="text-xl md:text-2xl">🔔</span>
                        <span id="notifCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] md:text-xs w-4 h-4 md:w-5 md:h-5 rounded-full flex items-center justify-center hidden shadow-md">0</span>
                    </div>
                    
                    <div class="flex items-center gap-2 glass px-2 md:px-3 py-1.5 md:py-2 rounded-xl border border-white">
                        <span class="text-lg md:text-xl" id="userIcon">👤</span>
                        <div class="hidden sm:block">
                            <p id="userName" class="text-xs md:text-sm font-bold text-theme-greenDark leading-tight"></p>
                            <p id="userRole" class="text-[10px] md:text-xs text-theme-textMuted font-medium"></p>
                        </div>
                    </div>
                    
                    <button onclick="handleLogout()" class="p-1.5 md:p-2 hover:bg-white/60 rounded-lg transition text-lg md:text-xl" title="Cerrar Sesión">
                        🚪
                    </button>
                </div>
            </header>
            <nav id="mainNav" class="glass border-b border-white px-4 py-2 shrink-0">
                <div class="flex gap-2 overflow-x-auto scrollbar-thin pb-1">
                </div>
            </nav>

            <main id="contentArea" class="flex-1 overflow-auto p-4 scrollbar-thin">
            </main>
        </div>
        

        <div id="notifPanel"
            class="hidden fixed right-4 top-20 w-80 glass rounded-2xl p-4 z-50 animate-slideIn max-h-96 flex flex-col shadow-xl border border-white">
            <div class="flex items-center justify-between mb-3 border-b border-theme-beige pb-2 shrink-0">
                <h3 class="font-bold flex items-center gap-2 text-theme-greenDark">🔔 Notificaciones</h3>
                <button onclick="clearAllNotifications()" class="text-xs font-bold text-theme-textMuted hover:text-red-500 bg-white/60 hover:bg-white px-2 py-1 rounded-md transition shadow-sm border border-transparent hover:border-red-200">
                    Limpiar
                </button>
            </div>
            <div id="notifList" class="space-y-2 overflow-y-auto scrollbar-thin pr-1 flex-1"></div>
        </div>

        

        <div id="toastContainer"></div>

        <div id="modalContainer"
            class="hidden fixed inset-0 bg-theme-text/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all">
        </div>
    </div>
